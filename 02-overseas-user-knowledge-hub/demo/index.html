<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overseas User Knowledge Hub (demo, synthetic data)</title>
<style>
:root{--bg:#f2f5f6;--surface:#fff;--ink:#15212b;--muted:#586873;--line:#dae1e5;--accent:#0e6b6b;--soft:#e0f0ef;--pos:#2b7a4b;--neg:#b23a3a;--mix:#8f6410}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;padding:20px 16px 48px}
.wrap{max-width:1100px;margin:0 auto}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:12.5px;margin:4px 0 12px}
.banner{background:#fff4dc;border:1px solid #ecd9a4;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:12px}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}nav button{font:inherit;background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);cursor:pointer}nav button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.layout{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}@media(max-width:800px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.fg{margin-bottom:12px}.fg h3{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:0 0 6px;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{font:inherit;font-size:12px;background:#e9eef0;border:0;border-radius:99px;padding:2px 10px;cursor:pointer}.chip.on{background:var(--accent);color:#fff}
input[type=search]{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:9px}
.top{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted)}.tag{font-size:11.5px;padding:0 8px;border-radius:4px;background:#e9eef0;color:var(--ink)}.tag.m{background:var(--soft);color:var(--accent);font-weight:700}
.Positive{color:var(--pos)}.Negative{color:var(--neg)}.Mixed{color:var(--mix)}.Neutral{color:var(--muted)}
.sum{font-weight:600;margin:5px 0 2px}.txt{color:var(--muted);font-size:13px}.count{color:var(--muted);font-size:13px;margin:0 0 8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}th{background:#f6f8f9;font-weight:600}td.l,th.l{text-align:left}
td.h{cursor:pointer}.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}.bar .t{width:170px}.bar .b{height:10px;background:var(--accent);border-radius:2px}.bar .n{color:var(--muted);width:24px}
</style></head><body><div class="wrap">
<h1>Overseas User Knowledge Hub</h1>
<div class="sub">Search and analyze community posts, linked to purchase records and product models. <b>Demo with synthetic data.</b></div>
<div class="banner">All posts, products and users in this demo are <b>invented</b> for illustration. No real company, customer or product data is included.</div>
<nav id="nav"><button class="on" data-v="search">Search</button><button data-v="heat">Model × Topic</button><button data-v="over">Overview</button></nav>
<div id="view"></div></div>
<script>
const D=[{"post_id": "P001", "date": "2026-07-09", "source": "user", "model": "Model A", "category": "Mobility scooter", "intent": "Pre-sales inquiry", "sentiment": "Neutral", "purchase_stage": "Not purchased", "topic_tags": "Fold & Carry; Price & Value", "summary_en": "Asks if the folded unit fits a compact sedan trunk", "text_en": "Hi all, thinking about buying this for my mom. Does it fit in the trunk of a small sedan once folded? Also how heavy is it with the battery?", "linked_to_order": "no"}, {"post_id": "P002", "date": "2026-07-11", "source": "user", "model": "Model A", "category": "Mobility scooter", "intent": "Share experience", "sentiment": "Positive", "purchase_stage": "Purchased", "topic_tags": "Comfort & Ergonomics; Setup & Usage", "summary_en": "Unboxing and first week with the unit", "text_en": "Unboxed mine today. Assembly took about ten minutes. Seat is comfortable and my dad says it feels steady on the sidewalk.", "linked_to_order": "no"}, {"post_id": "P003", "date": "2026-07-14", "source": "user", "model": "Model B", "category": "Mobility scooter", "intent": "Usage help", "sentiment": "Neutral", "purchase_stage": "Purchased", "topic_tags": "Setup & Usage; Braking & Safety", "summary_en": "Asks how to adjust the braking sensitivity", "text_en": "Is there a way to make the brake less sudden? It stops very quickly when I let go of the lever.", "linked_to_order": "yes"}, {"post_id": "P004", "date": "2026-07-15", "source": "user", "model": "Model D", "category": "Power wheelchair", "intent": "After-sales issue", "sentiment": "Negative", "purchase_stage": "Purchased", "topic_tags": "Quality & Defects", "summary_en": "Controller shows an error code after two weeks", "text_en": "Mine started showing an error on the display after two weeks and now the chair will not move. Support asked for a video.", "linked_to_order": "no"}, {"post_id": "P005", "date": "2026-07-18", "source": "official", "model": "Model D", "category": "Power wheelchair", "intent": "Official announcement", "sentiment": "Neutral", "purchase_stage": "Not purchased", "topic_tags": "After-sales & Service", "summary_en": "Announces a firmware update and how to install it", "text_en": "Firmware update available. Please follow the steps in the pinned guide and contact support if the update fails.", "linked_to_order": "no"}, {"post_id": "P006", "date": "2026-07-19", "source": "user", "model": "Model C", "category": "Mobility scooter", "intent": "Share experience", "sentiment": "Positive", "purchase_stage": "Purchased", "topic_tags": "Fold & Carry; Use-case Needs", "summary_en": "Took the scooter on a weekend trip", "text_en": "Took it in the trunk for a weekend trip. Folding was easy and we used it all day at the botanical garden.", "linked_to_order": "yes"}, {"post_id": "P007", "date": "2026-07-21", "source": "user", "model": "Model D", "category": "Power wheelchair", "intent": "Complaint", "sentiment": "Negative", "purchase_stage": "Purchased", "topic_tags": "Battery & Range; Quality & Defects", "summary_en": "Battery drains faster than the rated range", "text_en": "The rated range is far from what I get. Two hours of errands and I am almost out of charge.", "linked_to_order": "no"}, {"post_id": "P008", "date": "2026-07-22", "source": "user", "model": "Model E", "category": "Power wheelchair", "intent": "Beta application", "sentiment": "Positive", "purchase_stage": "Not purchased", "topic_tags": "Use-case Needs", "summary_en": "Applies for the beta program", "text_en": "I use a manual chair now but my shoulders hurt. I would love to test a compact power chair and give feedback.", "linked_to_order": "no"}, {"post_id": "P009", "date": "2026-07-24", "source": "user", "model": "Model A", "category": "Mobility scooter", "intent": "Suggestion", "sentiment": "Mixed", "purchase_stage": "Purchased", "topic_tags": "Accessories; Use-case Needs", "summary_en": "Wants a basket and a cane holder", "text_en": "Love the scooter, but please add a basket and a place to rest my cane. I shop every morning.", "linked_to_order": "yes"}, {"post_id": "P010", "date": "2026-07-26", "source": "user", "model": "Model F", "category": "Rollator", "intent": "Share experience", "sentiment": "Positive", "purchase_stage": "Purchased", "topic_tags": "Comfort & Ergonomics", "summary_en": "Seat height adjustment works well", "text_en": "The seat height adjustment is great. My wife is short and it finally fits her.", "linked_to_order": "no"}, {"post_id": "P011", "date": "2026-07-27", "source": "user", "model": "Model B", "category": "Mobility scooter", "intent": "After-sales issue", "sentiment": "Negative", "purchase_stage": "Purchased", "topic_tags": "Quality & Defects; After-sales & Service", "summary_en": "Handle screws loosen after daily use", "text_en": "The handle screws keep coming loose. I tightened them three times this month.", "linked_to_order": "no"}, {"post_id": "P012", "date": "2026-07-29", "source": "user", "model": "Model C", "category": "Mobility scooter", "intent": "Pre-sales inquiry", "sentiment": "Neutral", "purchase_stage": "Not purchased", "topic_tags": "Compliance & Certification; Use-case Needs", "summary_en": "Asks whether it is allowed on trains and planes", "text_en": "Can I take this on a train or a plane? I could not find any rules on the website.", "linked_to_order": "no"}, {"post_id": "P013", "date": "2026-07-31", "source": "user", "model": "Model E", "category": "Power wheelchair", "intent": "Usage help", "sentiment": "Neutral", "purchase_stage": "Purchased", "topic_tags": "Power & Terrain", "summary_en": "Asks about climbing small curbs", "text_en": "Will it climb a two-inch curb? I keep getting stuck at my driveway.", "linked_to_order": "no"}, {"post_id": "P014", "date": "2026-08-02", "source": "user", "model": "Model A", "category": "Mobility scooter", "intent": "Community chat", "sentiment": "Positive", "purchase_stage": "Purchased", "topic_tags": "Use-case Needs", "summary_en": "Thanks the group for tips", "text_en": "Thanks everyone for the tips on tire pressure. Rides are smoother now.", "linked_to_order": "no"}, {"post_id": "P015", "date": "2026-08-04", "source": "user", "model": "Model D", "category": "Power wheelchair", "intent": "Complaint", "sentiment": "Negative", "purchase_stage": "Purchased", "topic_tags": "Shipping & Packaging", "summary_en": "Arrived with a damaged control arm", "text_en": "Package arrived with a bent control arm. The box was clearly dropped.", "linked_to_order": "yes"}, {"post_id": "P016", "date": "2026-08-06", "source": "user", "model": "Model B", "category": "Mobility scooter", "intent": "Share experience", "sentiment": "Positive", "purchase_stage": "Purchased", "topic_tags": "Power & Terrain; Comfort & Ergonomics", "summary_en": "Rides well on gravel and grass", "text_en": "Took it on the gravel path at the park. No issues, felt stable.", "linked_to_order": "no"}, {"post_id": "P017", "date": "2026-08-08", "source": "user", "model": "Model A", "category": "Mobility scooter", "intent": "Pre-sales inquiry", "sentiment": "Neutral", "purchase_stage": "Not purchased", "topic_tags": "Competitor Comparison; Price & Value", "summary_en": "Compares with a lighter competitor", "text_en": "How does this compare to the folding scooters from other brands? I need something under 40 pounds.", "linked_to_order": "no"}, {"post_id": "P018", "date": "2026-08-10", "source": "user", "model": "Model C", "category": "Mobility scooter", "intent": "Suggestion", "sentiment": "Mixed", "purchase_stage": "Purchased", "topic_tags": "Fold & Carry", "summary_en": "Suggests a carry handle in the middle", "text_en": "Please put the carry handle at the center. Right now the weight pulls forward when I lift it.", "linked_to_order": "yes"}, {"post_id": "P019", "date": "2026-08-12", "source": "user", "model": "Model F", "category": "Rollator", "intent": "Usage help", "sentiment": "Neutral", "purchase_stage": "Purchased", "topic_tags": "Setup & Usage", "summary_en": "Asks how to fold the rollator", "text_en": "How do I fold it? The lever seems stuck.", "linked_to_order": "no"}, {"post_id": "P020", "date": "2026-08-14", "source": "user", "model": "Model D", "category": "Power wheelchair", "intent": "After-sales issue", "sentiment": "Negative", "purchase_stage": "Purchased", "topic_tags": "After-sales & Service", "summary_en": "Waited 10 days for a replacement part", "text_en": "Still waiting for the replacement part. It has been ten days with no update.", "linked_to_order": "no"}, {"post_id": "P021", "date": "2026-08-16", "source": "user", "model": "Model E", "category": "Power wheelchair", "intent": "Share experience", "sentiment": "Positive", "purchase_stage": "Purchased", "topic_tags": "Comfort & Ergonomics; Use-case Needs", "summary_en": "Uses the chair at work every day", "text_en": "The chair fits under my desk and I can finally stay out of pain through the workday.", "linked_to_order": "yes"}, {"post_id": "P022", "date": "2026-08-19", "source": "official", "model": "Model B", "category": "Mobility scooter", "intent": "Official announcement", "sentiment": "Neutral", "purchase_stage": "Not purchased", "topic_tags": "Accessories", "summary_en": "Announces a new accessory bundle", "text_en": "New accessory bundle is available. Check the pinned post for details.", "linked_to_order": "no"}, {"post_id": "P023", "date": "2026-08-21", "source": "user", "model": "Model A", "category": "Mobility scooter", "intent": "Complaint", "sentiment": "Negative", "purchase_stage": "Purchased", "topic_tags": "Battery & Range", "summary_en": "Range is lower in cold weather", "text_en": "Range drops almost by half when it gets cold.", "linked_to_order": "no"}, {"post_id": "P024", "date": "2026-08-23", "source": "user", "model": "Model C", "category": "Mobility scooter", "intent": "Share experience", "sentiment": "Positive", "purchase_stage": "Purchased", "topic_tags": "Fold & Carry; Price & Value", "summary_en": "Considers the unit good value", "text_en": "For the weight and price this is a great deal. I can lift it myself into the car.", "linked_to_order": "yes"}, {"post_id": "P025", "date": "2026-08-25", "source": "user", "model": "Model B", "category": "Mobility scooter", "intent": "Usage help", "sentiment": "Neutral", "purchase_stage": "Not purchased", "topic_tags": "Battery & Range", "summary_en": "Asks about charging time", "text_en": "How long does a full charge take, and can I leave it plugged in overnight?", "linked_to_order": "no"}, {"post_id": "P026", "date": "2026-08-27", "source": "user", "model": "Model D", "category": "Power wheelchair", "intent": "Beta application", "sentiment": "Positive", "purchase_stage": "Not purchased", "topic_tags": "Use-case Needs", "summary_en": "Volunteers to test a new release", "text_en": "I would like to join the next test round. I travel often and can report on airport use.", "linked_to_order": "no"}, {"post_id": "P027", "date": "2026-08-29", "source": "user", "model": "Model E", "category": "Power wheelchair", "intent": "Suggestion", "sentiment": "Mixed", "purchase_stage": "Purchased", "topic_tags": "Accessories", "summary_en": "Wants a cup holder and a bag hook", "text_en": "Please add a cup holder and a bag hook. Small things, but they matter every day.", "linked_to_order": "yes"}, {"post_id": "P028", "date": "2026-09-01", "source": "user", "model": "Model A", "category": "Mobility scooter", "intent": "After-sales issue", "sentiment": "Negative", "purchase_stage": "Purchased", "topic_tags": "Quality & Defects", "summary_en": "Flat tire and no way to repair at home", "text_en": "Flat tire. I cannot push it and I cannot carry it. Does anyone know a repair shop?", "linked_to_order": "no"}, {"post_id": "P029", "date": "2026-09-03", "source": "user", "model": "Model F", "category": "Rollator", "intent": "Share experience", "sentiment": "Positive", "purchase_stage": "Purchased", "topic_tags": "Braking & Safety", "summary_en": "Feels safer than a cane", "text_en": "The brakes make me feel much safer on slopes than my old walker.", "linked_to_order": "no"}, {"post_id": "P030", "date": "2026-09-05", "source": "user", "model": "Model C", "category": "Mobility scooter", "intent": "Pre-sales inquiry", "sentiment": "Neutral", "purchase_stage": "Not purchased", "topic_tags": "Shipping & Packaging; Price & Value", "summary_en": "Asks about shipping time and return policy", "text_en": "What is the delivery time to the West Coast? And what is the return policy if it does not fit?", "linked_to_order": "no"}, {"post_id": "P031", "date": "2026-09-07", "source": "user", "model": "Model B", "category": "Mobility scooter", "intent": "Share experience", "sentiment": "Mixed", "purchase_stage": "Purchased", "topic_tags": "Comfort & Ergonomics; Quality & Defects", "summary_en": "Likes the ride but the seat squeaks", "text_en": "Ride is smooth but the seat squeaks over bumps.", "linked_to_order": "no"}];
const S={q:'',model:new Set(),intent:new Set(),tag:new Set(),sen:new Set(),view:'search'};
const uniq=(f)=>[...new Set(D.flatMap(f))].sort();
const MODELS=uniq(p=>[p.model]),INT=uniq(p=>[p.intent]),TAG=uniq(p=>p.topic_tags.split('; ')),SEN=['Positive','Neutral','Mixed','Negative'];
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function ok(p){const q=S.q.toLowerCase();if(q&&!(p.summary_en+' '+p.text_en+' '+p.model+' '+p.topic_tags).toLowerCase().includes(q))return false;
 if(S.model.size&&!S.model.has(p.model))return false;if(S.intent.size&&!S.intent.has(p.intent))return false;
 if(S.sen.size&&!S.sen.has(p.sentiment))return false;if(S.tag.size&&![...S.tag].some(t=>p.topic_tags.split('; ').includes(t)))return false;return true}
function chips(name,list,set){return '<div class="fg"><h3>'+name+'</h3><div class="chips">'+list.map(v=>'<button class="chip'+(set.has(v)?' on':'')+'" data-set="'+name+'" data-v="'+esc(v)+'">'+esc(v)+'</button>').join('')+'</div></div>'}
const SETS={Model:S.model,Intent:S.intent,Topic:S.tag,Sentiment:S.sen};
function render(){const v=document.getElementById('view');document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
 const F=D.filter(ok);
 if(S.view==='search'){v.innerHTML='<div class="layout"><div class="panel"><input type="search" id="q" placeholder="Search posts" value="'+esc(S.q)+'">'+chips('Model',MODELS,S.model)+chips('Intent',INT,S.intent)+chips('Topic',TAG,S.tag)+chips('Sentiment',SEN,S.sen)+'</div><div><p class="count"><b>'+F.length+'</b> of '+D.length+' posts</p>'+F.map(p=>'<div class="card"><div class="top"><span class="tag m">'+p.model+'</span><span class="tag">'+esc(p.intent)+'</span><span class="'+p.sentiment+'">'+p.sentiment+'</span><span>'+p.date+'</span><span>'+p.purchase_stage+'</span>'+(p.linked_to_order==='yes'?'<span class="tag">linked to order</span>':'')+'</div><div class="sum">'+esc(p.summary_en)+'</div><div class="txt">'+esc(p.text_en)+'</div><div class="top" style="margin-top:6px">'+p.topic_tags.split('; ').map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</div></div>').join('')+'</div></div>';
  const q=document.getElementById('q');q.oninput=e=>{S.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)}}
 else if(S.view==='heat'){const cell=(m,t)=>D.filter(p=>p.model===m&&p.topic_tags.split('; ').includes(t)).length;const mx=Math.max(...MODELS.flatMap(m=>TAG.map(t=>cell(m,t))));
  v.innerHTML='<div class="panel"><p class="count">Posts per model and topic. Click a cell to open the matching posts.</p><div style="overflow:auto"><table><tr><th class="l">Topic</th>'+MODELS.map(m=>'<th>'+m+'</th>').join('')+'</tr>'+TAG.map(t=>'<tr><td class="l">'+esc(t)+'</td>'+MODELS.map(m=>{const n=cell(m,t);const a=n?0.15+0.7*n/mx:0;return '<td class="h" data-m="'+m+'" data-t="'+esc(t)+'" style="background:rgba(14,107,107,'+a.toFixed(2)+');color:'+(a>0.5?'#fff':'inherit')+'">'+(n||'')+'</td>'}).join('')+'</tr>').join('')+'</table></div></div>';
  v.querySelectorAll('td.h').forEach(td=>td.onclick=()=>{if(!td.textContent)return;S.model=new Set([td.dataset.m]);S.tag=new Set([td.dataset.t]);S.view='search';render()})}
 else{const cnt=(f)=>{const m={};F.forEach(p=>f(p).forEach(k=>m[k]=(m[k]||0)+1));return Object.entries(m).sort((a,b)=>b[1]-a[1])};
  const bars=(title,arr)=>{const mx=arr[0]?arr[0][1]:1;return '<div class="panel" style="margin-bottom:12px"><h3 style="margin:0 0 8px;font-size:13px">'+title+'</h3>'+arr.map(([k,n])=>'<div class="bar"><span class="t">'+esc(k)+'</span><span class="b" style="width:'+(n/mx*240)+'px"></span><span class="n">'+n+'</span></div>').join('')+'</div>'};
  v.innerHTML='<p class="count">Showing '+F.length+' posts (use Search to filter first).</p>'+bars('Intent',cnt(p=>[p.intent]))+bars('Topic',cnt(p=>p.topic_tags.split('; ')))+bars('Sentiment',cnt(p=>[p.sentiment]))}
 v.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const s=SETS[b.dataset.set];const x=b.dataset.v;s.has(x)?s.delete(x):s.add(x);render()})}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;render()});render();
</script></body></html>
